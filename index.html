<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>내 플랜북</title>
<style>
:root{--bg:#f3efe6;--card:#fffdf8;--ink:#1f2937;--mut:#6b7280;--line:#e2dccb;--acc:#c2410c;--navy:#12263f;--onacc:#fff;--warn:#b42318;--fh:Georgia,"Noto Serif KR",serif;--r:14px;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[data-t="1"]{--bg:#0b0e12;--card:#141a21;--ink:#f1f5f9;--mut:#94a3b8;--line:#263140;--acc:#fbbf24;--navy:#05070a;--onacc:#1a1205;--warn:#f87171;--fh:ui-monospace,Menlo,Consolas,monospace;--r:6px;color-scheme:dark}
[data-t="2"]{--bg:#efe4d2;--card:#fbf5ea;--ink:#3b2a1e;--mut:#7a6652;--line:#d8c7ab;--acc:#b7791f;--navy:#5a3a22;--r:10px}
[data-t="3"]{--bg:#fbf3f1;--card:#fff;--ink:#2b2230;--mut:#7d6f80;--line:#ecd9d6;--acc:#d9778a;--navy:#2f2a4a;--r:18px}
[data-t="4"]{--bg:#eef6fb;--card:#fff;--ink:#10324a;--mut:#547089;--line:#cfe3ef;--acc:#0e7fc0;--navy:#0b3a5c;--fh:system-ui,"Noto Sans KR",sans-serif;--r:16px}
[data-t="5"]{--bg:#edf9f3;--card:#fff;--ink:#0f3d36;--mut:#4f7a72;--line:#cdeade;--acc:#f0605d;--navy:#0f766e;--fh:system-ui,"Noto Sans KR",sans-serif;--r:20px}
[data-t="6"]{--bg:#0f0b1e;--card:#1a1433;--ink:#f3eefe;--mut:#a79bc9;--line:#31285a;--acc:#ff4fa3;--navy:#08051a;--onacc:#fff;--warn:#fb7185;--fh:system-ui,"Noto Sans KR",sans-serif;--r:12px;color-scheme:dark}
[data-t="7"]{--bg:#f6f6f4;--card:#fff;--ink:#1c1c1c;--mut:#777;--line:#e5e5e0;--acc:#111;--navy:#1c1c1c;--fh:system-ui,"Noto Sans KR",sans-serif;--r:4px}
[data-t="8"]{--bg:#f6ecdd;--card:#fffaf1;--ink:#43281a;--mut:#8a6a50;--line:#e4d2b6;--acc:#c2562a;--navy:#7a3b1e;--r:12px}
[data-t="9"]{--bg:#fbf8f0;--card:#fff;--ink:#1b2a4a;--mut:#6b7490;--line:#e3dfd0;--acc:#d63a3a;--navy:#1b3a8a;--r:8px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:10}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--navy);color:#fff;display:flex;align-items:center;gap:6px;padding:8px 12px}
.bar b{letter-spacing:.14em;font-size:13px;flex:1}.bar .sub{color:#b9c2cf;font-size:12px}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer}
.bar button{background:transparent;color:#fff;border-color:#ffffff44;font-size:12px;padding:5px 9px}.bar .pri,.pri{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;margin:3px 0}
main{max-width:640px;margin:0 auto;padding:22px 16px calc(40px + env(safe-area-inset-bottom,0px))}
h1{margin:0 0 4px;font-family:var(--fh);font-size:24px}.mut{color:var(--mut);font-size:13px}
.list{display:grid;gap:12px;margin-top:16px}
.pb{display:flex;overflow:hidden;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);text-decoration:none}
.pb .th{flex:none;width:92px;background:linear-gradient(160deg,var(--navy),color-mix(in srgb,var(--navy),#fff 16%)) center/cover;border-right:2px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:30px}
.pb .in{flex:1;min-width:0;padding:12px 14px}.pb h2{margin:0;font-family:var(--fh);font-size:17px}
.pb p{margin:2px 0 0;font-size:13px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pb .dt{display:inline-block;margin-top:6px;font:11px ui-monospace,monospace;letter-spacing:.08em;color:var(--acc)}
.pb .lk{display:flex;flex:1;min-width:0;color:inherit;text-decoration:none}
.ed{display:flex;flex-direction:column;justify-content:center;gap:4px;padding:6px}.ed button{padding:3px 9px;font-size:13px}
.row{display:flex;gap:6px;align-items:stretch}.row input{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-top:14px}
.dng{color:var(--warn)}.msg{margin-top:10px;color:var(--warn);font-size:13px}
.mask{position:fixed;inset:0;z-index:20;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px}.dlg{width:100%;max-width:380px;margin:0}
.acts{display:flex;gap:6px;margin-top:6px}
</style></head>
<body><div id="app"></div>
<script>
const API='https://planbook-admin.sukzzang0907.workers.dev/',$=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const IDRE=/^[a-z0-9-]{1,40}$/,isU=u=>/^https?:\/\//.test(u||'');
const DEF=['overview','map','glance','flights','hotels','days','tickets','transport','shop','prep','tips'];
const blank=()=>({title:'',sub:'',kicker:'',code:'',start:'',airline:'',overview:'',tpl:0,cover:'',days:[],hotels:[],flights:[],tickets:[],shop:[],transport:[],check:[],tips:'',order:DEF.slice(),hide:[]});
const TE=['✈️','🛫','🧳','🗼','🌊','🌴','🌃','⛰️','🏜️','📮'];
let L=[],D={},G=null,ui={edit:false,msg:'',sync:'',dlg:false,loading:true},fresh=new Set(),last='[]';
const call=async(op,id,data)=>{
  const body={op,pw:G.pw};if(id)body.id=id;if(data!==undefined)body.data=data;
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error==='pw'?'비밀번호가 올바르지 않습니다':'서버 오류 ('+(j.error||r.status)+')');
  return j;
};
const dday=s=>{if(!s)return '';const t=new Date();t.setHours(0,0,0,0);const n=Math.round((new Date(s+'T00:00:00')-t)/864e5);return isNaN(n)?'':n>0?'D-'+n:n===0?'D-DAY':''};
const card=(id,i)=>{
  const d=D[id]||blank(),t=Number.isInteger(+d.tpl)&&+d.tpl>=0&&+d.tpl<10?+d.tpl:0;
  const bg=isU(d.cover)?` style="background-image:url('${esc(d.cover)}')"`:'';
  const body=`<div class="th"${bg}>${isU(d.cover)?'':TE[t]}</div><div class="in"><h2>${esc(d.title)||'제목 없는 플랜북'}</h2>${d.sub?`<p>${esc(d.sub)}</p>`:''}<span class="dt">${esc(d.start||'')}${dday(d.start)?' · '+dday(d.start):''}${fresh.has(id)?' · 새 플랜북':''}</span></div>`;
  const ed=ui.edit?`<div class="ed"><button data-a="up" data-i="${i}" ${i?'':'disabled'}>↑</button><button data-a="dn" data-i="${i}" ${i<L.length-1?'':'disabled'}>↓</button><button class="dng" data-a="rm" data-i="${i}">제거</button></div>`:'';
  return `<div class="pb" data-t="${t}"><a class="lk" href="plan.html?id=${id}">${body}</a>${ed}</div>`;
};
function render(){
  const bar=`<div class="bar"><b>✈ PLANBOOK</b><span class="sub" id="sy">${esc(ui.sync)}</span><button class="${ui.edit?'pri':''}" data-a="edit">${ui.edit?'완료':'관리'}</button></div>`;
  const list=L.length?L.map(card).join(''):`<div class="card mut">${ui.loading?'불러오는 중…':'아직 플랜북이 없습니다.'}</div>`;
  const add=ui.edit?`<div class="card"><b>플랜북 추가</b><div class="mut">영문 소문자·숫자·하이픈, 1~40자 (예: phuquoc1225)</div><div class="row"><input id="nid" placeholder="플랜북 id" autocomplete="off" autocapitalize="off"><button data-a="add">추가</button></div>${ui.msg?`<div class="msg">${esc(ui.msg)}</div>`:''}</div>`:'';
  const dlg=ui.dlg?`<div class="mask"><div class="card dlg"><b>관리자 비밀번호</b><input id="pw" type="password" placeholder="비밀번호" autocomplete="off"><div class="acts"><button class="pri" data-a="unlock">확인</button><button data-a="cancel">취소</button></div>${ui.msg?`<div class="msg">${esc(ui.msg)}</div>`:''}</div></div>`:'';
  $('app').innerHTML=bar+`<main><h1>내 플랜북</h1><div class="mut">${L.length}개의 플랜북</div><div class="list">${list}</div>${add}</main>`+dlg;
  if(ui.dlg&&$('pw'))$('pw').focus();
}
async function loadData(ids){await Promise.all(ids.filter(id=>!D[id]).map(id=>fetch('data/'+id+'.json?'+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(o=>{if(o)D[id]=o}).catch(()=>{})))}
async function unlock(){
  G={pw:$('pw').value};
  try{const j=await call('plans_get');if(j.data&&Array.isArray(j.data.plans))L=j.data.plans;last=JSON.stringify(L);await loadData(L);ui.dlg=false;ui.edit=true;ui.msg='';render()}
  catch(e){G=null;ui.msg=e.message;render()}
}
async function finish(){
  ui.msg='';ui.sync='GitHub 저장 중…';render();
  try{
    for(const id of fresh){
      if(!L.includes(id))continue;
      const g=await call('get',id);               // 이미 있는 데이터는 덮어쓰지 않는다
      if(!g.data)await call('put',id,D[id]||blank());
    }
    await call('plans_put',null,{plans:L});
    last=JSON.stringify(L);fresh=new Set();ui.edit=false;ui.sync='커밋됨 · 사이트 반영까지 최대 10분';
  }catch(e){ui.sync='';ui.msg='저장 실패: '+e.message}
  render();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,i=+b.dataset.i;
  if(a==='edit'){if(ui.edit){finish();return}if(G){ui.edit=true;render()}else{ui.dlg=true;ui.msg='';render()}}
  else if(a==='unlock')unlock();
  else if(a==='cancel'){ui.dlg=false;ui.msg='';render()}
  else if(a==='up'&&i>0){[L[i-1],L[i]]=[L[i],L[i-1]];render()}
  else if(a==='dn'&&i<L.length-1){[L[i+1],L[i]]=[L[i],L[i+1]];render()}
  else if(a==='rm'){if(confirm('목록에서 제거할까요? (플랜북 파일은 삭제되지 않습니다)')){fresh.delete(L[i]);L.splice(i,1);render()}}
  else if(a==='add'){
    const id=($('nid').value||'').trim();
    if(!IDRE.test(id))ui.msg='id는 영문 소문자·숫자·하이픈 1~40자만 쓸 수 있습니다';
    else if(L.includes(id))ui.msg='이미 목록에 있는 id입니다';
    else if(L.length>=50)ui.msg='플랜북은 최대 50개까지입니다';
    else{ui.msg='';L.push(id);fresh.add(id);if(!D[id])loadData([id]).then(render)}
    render();
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='pw')unlock();if(e.key==='Enter'&&e.target.id==='nid')document.querySelector('[data-a="add"]').click()});
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
fetch('plans.json?'+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(async o=>{if(o&&Array.isArray(o.plans)&&!ui.edit){L=o.plans.filter(x=>IDRE.test(x));last=JSON.stringify(L);await loadData(L)}}).catch(()=>{}).finally(()=>{ui.loading=false;render()});
</script></body></html>
