<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://planbook-admin.sukzzang0907.workers.dev; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>귤율 여행 플랜북</title>
<style>
:root{--bg:#f3efe6;--card:#fffdf8;--ink:#1f2937;--mut:#6b7280;--line:#e2dccb;--acc:#c2410c;--navy:#12263f;--onacc:#fff;--warn:#b42318;--fh:Georgia,"Noto Serif KR",serif;--r:14px;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[data-t="1"]{--bg:#0b0e12;--card:#141a21;--ink:#f1f5f9;--mut:#94a3b8;--line:#263140;--acc:#fbbf24;--navy:#05070a;--onacc:#1a1205;--warn:#f87171;--fh:ui-monospace,Menlo,Consolas,monospace;--r:6px;color-scheme:dark}
[data-t="2"]{--bg:#efe4d2;--card:#fbf5ea;--ink:#3b2a1e;--mut:#7a6652;--line:#d8c7ab;--acc:#b7791f;--navy:#5a3a22;--r:10px}
[data-t="3"]{--bg:#fbf3f1;--card:#fff;--ink:#2b2230;--mut:#7d6f80;--line:#ecd9d6;--acc:#d9778a;--navy:#2f2a4a;--r:18px}
[data-t="4"]{--bg:#eef6fb;--card:#fff;--ink:#10324a;--mut:#547089;--line:#cfe3ef;--acc:#0e7fc0;--navy:#0b3a5c;--fh:system-ui,"Noto Sans KR",sans-serif;--r:16px}
[data-t="5"]{--bg:#edf9f3;--card:#fff;--ink:#0f3d36;--mut:#4f7a72;--line:#cdeade;--acc:#f0605d;--navy:#0f766e;--fh:system-ui,"Noto Sans KR",sans-serif;--r:20px}
[data-t="6"]{--bg:#0f0b1e;--card:#1a1433;--ink:#f3eefe;--mut:#a79bc9;--line:#31285a;--acc:#ff4fa3;--navy:#08051a;--onacc:#fff;--warn:#fb7185;--fh:system-ui,"Noto Sans KR",sans-serif;--r:12px;color-scheme:dark}
[data-t="7"]{--bg:#f6f6f4;--card:#fff;--ink:#1c1c1c;--mut:#777;--line:#e5e5e0;--acc:#111;--navy:#1c1c1c;--fh:system-ui,"Noto Sans KR",sans-serif;--r:4px}
[data-t="8"]{--bg:#f6ecdd;--card:#fffaf1;--ink:#43281a;--mut:#8a6a50;--line:#e4d2b6;--acc:#c2562a;--navy:#7a3b1e;--r:12px}
[data-t="9"]{--bg:#fbf8f0;--card:#fff;--ink:#1b2a4a;--mut:#6b7490;--line:#e3dfd0;--acc:#d63a3a;--navy:#1b3a8a;--r:8px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:10}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--navy);color:#fff;display:flex;align-items:center;gap:6px;padding:8px 12px}
.bar b{letter-spacing:.14em;font-size:13px;flex:1}.bar .sub{color:#b9c2cf;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer}
.bar button{background:transparent;color:#fff;border-color:#ffffff44;font-size:12px;padding:5px 9px;white-space:nowrap}.bar .pri,.pri{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
main{max-width:640px;margin:0 auto;padding:22px 16px calc(40px + env(safe-area-inset-bottom,0px))}
h1{margin:0 0 4px;font-family:var(--fh);font-size:24px}.mut{color:var(--mut);font-size:13px}
.list{display:grid;gap:12px;margin-top:16px}
.pb{display:flex;overflow:hidden;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:var(--r)}
.pb .lk{display:flex;flex:1;min-width:0;color:inherit;text-decoration:none}
.pb .th{flex:none;width:92px;background:linear-gradient(160deg,var(--navy),color-mix(in srgb,var(--navy),#fff 16%)) center/cover;border-right:2px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:30px}
.pb .in{flex:1;min-width:0;padding:12px 14px}.pb h2{margin:0;font-family:var(--fh);font-size:17px}
.pb p{margin:2px 0 0;font-size:13px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pb .dt{display:inline-block;margin-top:6px;font:11px ui-monospace,monospace;letter-spacing:.08em;color:var(--acc)}
.ed{display:flex;align-items:center;padding:6px}.dng{color:var(--warn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.add{width:100%;border-style:dashed;margin-top:12px;padding:12px}
.login{text-align:center;padding-top:56px}.login h1{font-size:30px}
.login .btns{display:grid;gap:10px;max-width:320px;margin:28px auto 0}
.sb{display:block;padding:12px 14px;border-radius:10px;font-weight:700;text-decoration:none;border:1px solid var(--line)}
.sb.g{background:#fff;color:#1f1f1f;border-color:#dadce0}.sb.k{background:#fee500;color:#191919;border-color:#fee500}
.sec{font-size:15px;margin:26px 0 0;color:var(--mut)}
.mask{position:fixed;inset:0;z-index:20;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px}.dlg{width:100%;max-width:380px;margin:0}
.legal{font-size:12px;color:var(--mut);text-align:center;margin:22px 0 0}.legal a{color:inherit}.h4{margin:16px 0 4px;font-size:14px}.dlg ul{margin:6px 0;padding-left:20px}.row{display:flex;gap:6px;align-items:center;margin:4px 0}.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.msg{margin-top:14px;color:var(--warn);font-size:13px}
</style></head>
<body><div id="app"></div>
<script>
const API='https://planbook-admin.sukzzang0907.workers.dev/',$=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}},del:k=>{try{localStorage.removeItem(k)}catch{}}};
const SS={get:k=>{try{return sessionStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{sessionStorage.setItem(k,v)}catch{}},del:k=>{try{sessionStorage.removeItem(k)}catch{}}};
const b64u=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const sha=async s=>b64u(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)));
let CV=SS.get('pb_cv');if(!CV){CV=b64u(crypto.getRandomValues(new Uint8Array(32)));SS.set('pb_cv',CV)}
let CC='';
const DEF=['overview','map','glance','flights','hotels','days','tickets','transport','shop','prep','tips'];
const blank=()=>({title:'',sub:'',kicker:'',code:'',start:'',airline:'',overview:'',tpl:0,cover:'',days:[],hotels:[],flights:[],tickets:[],shop:[],transport:[],check:[],tips:'',order:DEF.slice(),hide:[]});
const TE=['✈️','🛫','🧳','🗼','🌊','🌴','🌃','⛰️','🏜️','📮'];
const ERR={rate:'로그인 시도가 너무 많습니다. 1분 뒤에 다시 시도해 주세요',denied:'로그인이 취소되었습니다',token:'로그인에 실패했습니다. 다시 시도해 주세요',profile:'계정 정보를 가져오지 못했습니다',code:'로그인 코드가 만료되었습니다. 다시 시도해 주세요'};
let T=LS.get('pb_token'),ui={name:LS.get('pb_name')||'',list:null,shared:[],edit:false,msg:'',loading:true,offline:false,invite:null,dlg:null,acct:null,merge:null};
const PV={google:'Google',kakao:'카카오'};
const startUrl=p=>API+'auth/'+p+'/start?return='+encodeURIComponent(here())+'&cc='+CC;
const api=async(p,o={})=>{
  const r=await fetch(API+p,{...o,headers:{...(o.body?{'Content-Type':'application/json'}:{}),...(T?{Authorization:'Bearer '+T}:{})}});
  const j=await r.json().catch(()=>({}));
  if(r.status===401&&T&&j.error==='auth'){T=null;LS.del('pb_token');ui.list=null}   // 세션 만료일 때만 로그아웃 처리 (로그인 코드 오류 등은 제외)
  if(!r.ok)throw Object.assign(new Error(r.status===429?'요청이 너무 많습니다. 1분 뒤에 다시 시도해 주세요':(j.error||r.status)),{status:r.status});
  return j;
};
const dday=s=>{if(!s)return '';const t=new Date();t.setHours(0,0,0,0);const n=Math.round((new Date(s+'T00:00:00')-t)/864e5);return isNaN(n)?'':n>0?'D-'+n:n===0?'D-DAY':''};
const here=()=>location.origin+location.pathname;
const clearLocal=()=>['pb_token','pb_name','pb_list'].forEach(LS.del);
const RL={viewer:'보기 전용',editor:'편집 가능'};
const card=(p,shared)=>{
  const t=Number.isInteger(+p.tpl)&&+p.tpl>=0&&+p.tpl<10?+p.tpl:0,dd=dday(p.start);
  const badge=shared?` · <b>${RL[p.role]||''}</b>`:(p.access==='view'?' · 🔗 링크 공유':p.access==='edit'?' · ✏️ 링크 편집':'');
  return `<div class="pb" data-t="${t}"><a class="lk" href="plan.html?id=${esc(p.id)}"><div class="th">${TE[t]}</div><div class="in"><h2>${esc(p.title)||'제목 없는 플랜북'}</h2>${p.sub?`<p>${esc(p.sub)}</p>`:''}<span class="dt">${esc(p.start||'')}${dd?' · '+dd:''}${badge}</span></div></a>${ui.edit?`<div class="ed"><button class="dng" data-a="${shared?'leave':'del'}" data-id="${esc(p.id)}">${shared?'나가기':'삭제'}</button></div>`:''}</div>`;
};
function render(){
  let bar,main;
  if(!T){
    bar='<div class="bar"><b>✈ PLANBOOK</b></div>';
    main=`<main class="login"><h1>귤율 여행 플랜북</h1>${ui.invite?`<div class="card" style="max-width:320px;margin:18px auto 0"><b>${esc(ui.invite.title)||'제목 없는 플랜북'}</b><div class="mut">플랜북에 초대되었습니다 · ${RL[ui.invite.role]}<br>로그인하면 바로 참여합니다</div></div>`:'<div class="mut">로그인하면 내가 만든 플랜북이 모두 보입니다</div>'}<div class="btns"><a class="sb g" href="${startUrl('google')}">Google로 계속하기</a><a class="sb k" href="${startUrl('kakao')}">카카오로 계속하기</a></div><p class="legal">로그인하면 <a href="terms.html">이용약관</a>과 <a href="privacy.html">개인정보처리방침</a>에 동의한 것으로 봅니다.</p>${ui.msg?`<div class="msg">${esc(ui.msg)}</div>`:''}</main>`;
  }else{
    bar=`<div class="bar"><b>✈ PLANBOOK</b><span class="sub">${esc(ui.name)}</span><button class="${ui.edit?'pri':''}" data-a="edit">${ui.edit?'완료':'관리'}</button><button data-a="acct">계정</button></div>`;
    const L=ui.list,SH=ui.shared||[];
    main=`<main><h1>귤율 여행 플랜북</h1><div class="mut">${L?L.length+'개의 플랜북':''}${ui.offline?' · 오프라인 (마지막으로 본 목록)':''}</div><div class="list">${L?(L.length?L.map(x=>card(x,false)).join(''):'<div class="card mut">아직 플랜북이 없습니다. 아래 버튼으로 첫 플랜북을 만들어 보세요.</div>'):`<div class="card mut">${ui.loading?'불러오는 중…':'목록을 불러오지 못했습니다'}</div>`}</div><button class="add" data-a="new">＋ 새 플랜북</button>${SH.length?`<h2 class="sec">공유받은 플랜북</h2><div class="list">${SH.map(x=>card(x,true)).join('')}</div>`:''}${ui.msg?`<div class="msg">${esc(ui.msg)}</div>`:''}</main>`;
  }
  const foot=T?'<p class="legal">© 귤율 여행 플랜북 · <a href="terms.html">이용약관</a> · <a href="privacy.html">개인정보처리방침</a></p>':'';
  $('app').innerHTML=bar+main.replace(/<\/main>$/,foot+'</main>')+dialogs();
}
const idRow=x=>`<div class="row"><span style="flex:1"><b>${PV[x.provider]||esc(x.provider)}</b> <span class="mut">${esc(x.name)}</span></span>${ui.acct.identities.length>1?`<button class="dng" data-a="unlink" data-id="${x.id}">해제</button>`:''}</div>`;
function dialogs(){
  if(ui.dlg==='merge'&&ui.merge){
    const m=ui.merge;
    return `<div class="mask"><div class="card dlg"><b>계정 합치기</b><p>연결하려는 ${m.providers.map(x=>PV[x]||x).join('·')} 계정에 이미 데이터가 있습니다.</p><ul><li>플랜북 <b>${m.plans}개</b></li><li>공유받은 플랜북 <b>${m.shared}개</b></li></ul><p class="mut">합치면 모두 <b>지금 로그인한 계정</b>으로 옮겨지고, 상대 계정은 사라집니다. <b>되돌릴 수 없습니다.</b></p>${ui.msg?`<div class="msg">${esc(ui.msg)}</div>`:''}<div class="acts"><button class="pri" data-a="domerge">합치기</button><button data-a="closedlg">취소</button></div></div></div>`;
  }
  if(ui.dlg==='acct'){
    const A=ui.acct,has=A?A.identities.map(x=>x.provider):[];
    return `<div class="mask"><div class="card dlg" style="max-height:90vh;overflow:auto"><b>계정</b>${!A?'<p class="mut">불러오는 중…</p>':`
      <h4 class="h4">연결된 로그인</h4>${A.identities.map(idRow).join('')}
      ${['google','kakao'].some(p=>!has.includes(p))?`<p class="mut">다른 로그인도 연결해 두면 어느 쪽으로 들어와도 같은 플랜북이 보입니다.</p><div class="acts">${['google','kakao'].filter(p=>!has.includes(p)).map(p=>`<button data-a="link" data-p="${p}">${PV[p]} 연결</button>`).join('')}</div>`:''}
      <h4 class="h4">로그아웃 · 삭제</h4><div class="acts"><button data-a="logout">로그아웃</button><button class="dng" data-a="delacct">계정 삭제</button></div>
      <p class="legal"><a href="terms.html">이용약관</a> · <a href="privacy.html">개인정보처리방침</a></p>`}
      ${ui.msg?`<div class="msg">${esc(ui.msg)}</div>`:''}<div class="acts"><button data-a="closedlg">닫기</button></div></div></div>`;
  }
  return '';
}
async function load(){
  if(!T){ui.loading=false;return render()}
  try{const j=await api('api/plans');ui.list=j.plans;ui.shared=j.shared||[];ui.offline=false;LS.set('pb_list',JSON.stringify({plans:j.plans,shared:ui.shared}))}
  catch(e){if(e.status!==401){try{const c=JSON.parse(LS.get('pb_list')||'null');if(c&&c.plans){ui.list=c.plans;ui.shared=c.shared||[];ui.offline=true}}catch{}}}
  ui.loading=false;render();
}
// 초대 링크: 로그인한 상태면 바로 수락, 아니면 로그인 후 이어서 처리
async function joinPending(){
  const tk=LS.get('pb_join');if(!tk||!/^[a-z0-9]{24}$/.test(tk))return LS.del('pb_join');
  if(!T)return;
  LS.del('pb_join');
  try{const j=await api('api/invites/'+tk+'/accept',{method:'POST'});location.href='plan.html?id='+j.id;return true}
  catch(e){ui.msg=e.message==='limit'?'이 플랜북은 더 이상 구성원을 받을 수 없습니다':'초대 링크가 만료되었거나 올바르지 않습니다'}
}
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;ui.msg='';
  if(a==='edit'){ui.edit=!ui.edit;render()}
  else if(a==='acct'){ui.dlg='acct';ui.acct=null;render();try{ui.acct=await api('api/me')}catch(x){ui.dlg=null;ui.msg='계정 정보를 불러오지 못했습니다'}render()}
  else if(a==='closedlg'){ui.dlg=null;ui.merge=null;SS.del('pb_linkcode');render()}
  else if(a==='logout'){try{await api('auth/logout',{method:'POST'})}catch{}T=null;clearLocal();ui={name:'',list:null,shared:[],edit:false,msg:'',loading:false,offline:false,invite:null,dlg:null,acct:null,merge:null};render()}
  else if(a==='link'){SS.set('pb_link','1');location.href=startUrl(b.dataset.p)}
  else if(a==='unlink'){if(!confirm('이 로그인 수단을 해제할까요? 해제하면 이 방법으로는 더 이상 이 계정에 들어올 수 없습니다.'))return;try{await api('api/identities/'+b.dataset.id,{method:'DELETE'});ui.acct=await api('api/me')}catch(x){ui.msg=x.message==='last'?'마지막 로그인 수단은 해제할 수 없습니다':'해제하지 못했습니다'}render()}
  else if(a==='domerge'){b.disabled=true;try{await api('api/link',{method:'POST',body:JSON.stringify({code:SS.get('pb_linkcode'),cv:SS.get('pb_linkcv'),merge:true})});SS.del('pb_linkcode');SS.del('pb_linkcv');ui.dlg=null;ui.merge=null;ui.msg='';await load();ui.msg='계정을 합쳤습니다';render()}catch(x){ui.msg=x.message==='limit'?'합치면 플랜북이 50개를 넘어 합칠 수 없습니다':x.message==='code'?'시간이 지나 만료되었습니다. 다시 연결해 주세요':'합치지 못했습니다 ('+x.message+')';render()}}
  else if(a==='delacct'){
    if(!confirm('계정을 삭제할까요?\n\n내가 만든 모든 플랜북, 공유 설정, 연결된 로그인이 즉시 삭제되고 되돌릴 수 없습니다.\n(필요하면 먼저 각 플랜북을 PDF로 저장하세요)'))return;
    if(prompt('계속하려면 "삭제"를 입력하세요')!=='삭제'){ui.msg='취소되었습니다';render();return}
    try{await api('api/me',{method:'DELETE',body:JSON.stringify({confirm:true})});T=null;clearLocal();ui={name:'',list:null,shared:[],edit:false,msg:'계정이 삭제되었습니다',loading:false,offline:false,invite:null,dlg:null,acct:null,merge:null};render()}
    catch(x){ui.msg='삭제하지 못했습니다 ('+x.message+')';render()}}
  else if(a==='new'){b.disabled=true;try{const j=await api('api/plans',{method:'POST',body:JSON.stringify({data:blank()})});location.href='plan.html?id='+j.id}catch(x){ui.msg=x.message==='limit'?'플랜북은 최대 50개까지 만들 수 있습니다':'만들지 못했습니다 ('+x.message+')';render()}}
  else if(a==='leave'){if(!confirm('이 공유받은 플랜북에서 나갈까요? (내 목록에서만 사라집니다)'))return;try{await api('api/plans/'+b.dataset.id+'/members/me',{method:'DELETE'});await load()}catch(x){ui.msg='나가지 못했습니다 ('+x.message+')';render()}}
  else if(a==='del'){if(!confirm('이 플랜북을 삭제할까요? 공유받은 사람도 더 이상 볼 수 없고, 되돌릴 수 없습니다.'))return;try{await api('api/plans/'+b.dataset.id,{method:'DELETE'});await load()}catch(x){ui.msg='삭제하지 못했습니다 ('+x.message+')';render()}}
});
(async()=>{
  CC=await sha(CV);
  const qj=new URLSearchParams(location.search).get('join');
  if(qj){LS.set('pb_join',qj);history.replaceState(null,'',location.pathname)}
  const h=new URLSearchParams(location.hash.slice(1));
  if(h.has('code')||h.has('error')){history.replaceState(null,'',location.pathname+location.search)}
  if(h.has('error'))ui.msg=ERR[h.get('error')]||'로그인에 실패했습니다';
  if(h.has('code')){
    const code=h.get('code');
    if(SS.get('pb_link')==='1'&&T){
      // 계정 연결 모드: 새 세션을 만들지 않고, 받은 코드를 지금 로그인한 계정에 붙인다
      SS.del('pb_link');SS.set('pb_linkcode',code);SS.set('pb_linkcv',CV);
      try{
        const pv=await api('api/link/preview',{method:'POST',body:JSON.stringify({code,cv:CV})});
        if(pv.same){SS.del('pb_linkcode');ui.msg='이미 이 계정에 연결되어 있습니다'}
        else if(pv.plans===0&&pv.shared===0){await api('api/link',{method:'POST',body:JSON.stringify({code,cv:CV})});SS.del('pb_linkcode');ui.msg='로그인 수단을 연결했습니다'}
        else{ui.merge=pv;ui.dlg='merge'}
        SS.del('pb_cv');CV=b64u(crypto.getRandomValues(new Uint8Array(32)));SS.set('pb_cv',CV);CC=await sha(CV);
      }catch(x){ui.msg=x.status===401?'연결 시간이 지났습니다. 다시 시도해 주세요':'연결하지 못했습니다 ('+x.message+')'}
    }else{
      SS.del('pb_link');
      try{const j=await api('auth/exchange',{method:'POST',body:JSON.stringify({code,cv:CV})});T=j.token;ui.name=j.user.name||'';LS.set('pb_token',T);LS.set('pb_name',ui.name);SS.del('pb_cv');CV=b64u(crypto.getRandomValues(new Uint8Array(32)));SS.set('pb_cv',CV);CC=await sha(CV)}
      catch(x){ui.msg=ERR.code}
    }
  }
  const pj=LS.get('pb_join');
  if(pj&&!T){try{const r=await fetch(API+'api/invites/'+pj);if(r.ok)ui.invite=await r.json();else{LS.del('pb_join');ui.msg='초대 링크가 만료되었거나 올바르지 않습니다'}}catch{}}
  render();
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  if(T&&await joinPending())return;
  load();
})();
</script></body></html>
