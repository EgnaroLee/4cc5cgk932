name = "planbook-admin"
main = "worker.js"
compatibility_date = "2026-11-01"

[vars]
# 사이트 origin (경로 없이). 저장소 이름을 바꾼 뒤에도 origin은 같다.
ALLOW_ORIGIN = "https://egnarolee.github.io"
# 임시 호환 스위치: 새 사이트(로그인 검증값을 보내는 버전)가 배포되기 전/중에도 옛 사이트가 로그인되도록 허용.
# 새 사이트가 올라간 것을 확인한 뒤 이 줄을 지우고 다시 배포하세요. (켜 둔 동안에는 로그인 코드 가로채기 방어가 약해집니다)
LEGACY_LOGIN = "1"

[[d1_databases]]
binding = "DB"
database_name = "planbook"
database_id = "32d454b0-5a6d-4e41-8c58-9a6736494093"   # wrangler d1 create planbook 결과의 id

# 호출 횟수 제한 (Cloudflare Workers Rate Limiting). period 는 10 또는 60 만 가능.
[[ratelimits]]
name = "LOGIN_RL"        # 로그인 시작: IP 별
namespace_id = "1001"
simple = { limit = 4, period = 60 }

[[ratelimits]]
name = "EDIT_RL"         # 저장·생성·삭제·공유 등 데이터 변경: 계정 별
namespace_id = "1002"
simple = { limit = 4, period = 60 }

# 로그인 실패 원인 등을 Cloudflare 대시보드(Workers → Observability)에서 볼 수 있도록 로그 보관
[observability]
enabled = true
